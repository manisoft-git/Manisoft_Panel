services:
  - type: web
    name: manisoft-panel
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev --ignore-scripts
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPERATOR_EMAIL
        value: manifestsubeno@gmail.com
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: "3000"
